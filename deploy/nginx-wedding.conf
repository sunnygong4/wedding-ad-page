# Nginx server block for wedding.sunnygong.com
# -------------------------------------------------
# Static site behind Cloudflare. Listens on port 80;
# let Cloudflare terminate HTTPS (SSL mode "Full" with an
# Origin Certificate is recommended — see DEPLOY.md).
#
# Install:
#   sudo cp deploy/nginx-wedding.conf /etc/nginx/sites-available/wedding.sunnygong.com
#   sudo ln -s /etc/nginx/sites-available/wedding.sunnygong.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name wedding.sunnygong.com;

    # Path to the cloned repo (adjust if you clone elsewhere)
    root /var/www/wedding-ad-page;
    index index.html;

    # Restore the real visitor IP from Cloudflare (optional but nice for logs).
    # Cloudflare IP ranges: https://www.cloudflare.com/ips/
    real_ip_header CF-Connecting-IP;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long cache for static assets, short for the HTML entry point
    location ~* \.(css|js|jpg|jpeg|png|webp|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Let Cloudflare/clients fetch these directly
    location = /robots.txt  { access_log off; }
    location = /sitemap.xml { access_log off; }

    gzip on;
    gzip_types text/css application/javascript application/xml image/svg+xml;
}
